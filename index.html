<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <script>
    window.__ENV__ = {
      VITE_SUPABASE_URL:      'sb_publishable_acbF6EkNpK9_DEKUJZOb4w_hAbciaul',
      VITE_SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVheXd3cGl1c3F6Znpra2xjbXlnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5ODg3OTUsImV4cCI6MjA5NjU2NDc5NX0.E8ey4LUHRvcUfvCGa_vCY1lRWQFddRodcE94bYj-DQ0'
    };
  </script>
</head>
<body>
<div id="toast-container" aria-live="polite"></div>

<div class="admin-login-page">
  <div class="admin-login-card scroll-reveal visible">
    <h1>The Happy Spoon</h1>
    <p class="sub">Admin Dashboard — sign in to continue</p>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="admin-email">Email</label>
        <input type="email" id="admin-email" placeholder="admin@thehappyspoon.in" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="admin-password">Password</label>
        <input type="password" id="admin-password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="submit-btn" style="margin-top:8px">
        <div class="spinner" aria-hidden="true"></div>
        <span class="btn-text">Sign In</span>
      </button>
    </form>
  </div>
</div>

<script type="module">
  import { supabase } from '../js/supabase.js';
  import { showToast } from '../js/toast.js';

  // Redirect if already logged in
  const { data: { session } } = await supabase.auth.getSession();
  if (session) location.replace('./dashboard.html');

  const form = document.getElementById('login-form');
  const btn  = form.querySelector('.submit-btn');
  const txt  = btn.querySelector('.btn-text');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email    = document.getElementById('admin-email').value.trim();
    const password = document.getElementById('admin-password').value;

    if (!email || !password) {
      showToast('Please enter both email and password.', 'error');
      return;
    }

    btn.disabled = true;
    btn.classList.add('loading');
    txt.textContent = 'Signing in…';

    const { error } = await supabase.auth.signInWithPassword({ email, password });

    btn.disabled = false;
    btn.classList.remove('loading');
    txt.textContent = 'Sign In';

    if (error) {
      showToast('Invalid email or password.', 'error');
    } else {
      location.replace('./dashboard.html');
    }
  });
</script>
</body>
</html>
